name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  build-test-lint:
    name: build · unit tests · lint
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Build (staging debug)
        run: ./gradlew :app:assembleStagingDebug --stacktrace
      - name: Release build (R8, both flavours, debug-signed)
        run: ./gradlew :app:assembleStagingRelease :app:assembleProdRelease --stacktrace
      - name: Unit tests
        run: ./gradlew :app:testStagingDebugUnitTest :app:testProdDebugUnitTest --continue
      - name: Coverage gate (Kover)
        run: ./gradlew :app:koverVerifyStagingDebug :app:koverHtmlReportStagingDebug
      - name: Style and static analysis (ktlint, detekt)
        run: ./gradlew ktlintCheck detekt --continue
      - name: Lint
        run: ./gradlew :app:lintStagingDebug
      - name: Parity coverage (skips when the appendix is not on the runner)
        run: bash tools/parity-coverage.sh
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/tests/**
            app/build/reports/kover/**
            app/build/reports/lint-results-*.html
            build/reports/ktlint/**
            build/reports/detekt/**
          if-no-files-found: ignore
